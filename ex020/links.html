<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        a {
           color: red;
           text-decoration: none;
           font-weight: bold; 
        }

        a:visited {
            color:  darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: forestgreen;
        }

        a::after {
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: aqua;
        }
    </style>
</head>
<body>
    <h1>
        <ul>
            <li><a href="https://github.com/"target="_blank">Repositório GitHub</a></li>
            <li><a href="https://www.facebook.com/"target="_blank">Facebook</a></li>
            <li><a href="https://www.instagram.com/?hl=pt-br"target="_blank">Instagram</a></li>
        </ul>
    </h1>
    
</body>
</html>
